name: Music card

on:
  schedule:
    # Toutes les 30 minutes (à :17 et :47, hors de l'heure pile où GitHub est le plus chargé)
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build card from ListenBrainz
        env:
          LB_USER: Elvalio
        run: python scripts/music_card.py

      - name: Commit if changed
        run: |
          if git add -N assets/music.json && git diff --quiet -- assets/music-dark.svg assets/music-light.svg assets/music.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music-dark.svg assets/music-light.svg assets/music.json
          git commit -m "Update music card"
          git push
